<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kasir Jaya Tekno 3D - Kenapa Kita Butuh Excel?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* ===== 1. DASAR ===== */
:root{--p:#107C41;--p2:#21A366;--pd:#0B5A2F;--pl:#E8F5EE;--ink:#14211A;--mut:#5B6B62;--line:#E3E9E5;--dark:#0F1F17;--r:#EF4444;--y:#FFC93C;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#DCE7E1,#F4F1EA)}
h1,h2,h3,h4{font-family:'Poppins',sans-serif;font-weight:600;line-height:1.25}
button{font:inherit;cursor:pointer}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
code,.mono{font-family:var(--mono)}

/* ===== 2. HUD ATAS ===== */
.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;align-items:center;gap:10px;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-radius:14px;padding:8px 14px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.brand b{font:700 16px 'Poppins'}.brand b span{color:var(--p)}
.chips{display:flex;gap:6px;background:rgba(15,31,23,.88);border-radius:14px;padding:6px 8px}
.chip{font:600 12px var(--mono);color:#8FA99A;padding:6px 10px;border-radius:9px;white-space:nowrap}
.chip.on{background:#21A366;color:#fff}.chip.done{color:#7EE2A8}
.stats{margin-left:auto;display:flex;gap:6px;background:rgba(15,31,23,.88);color:#E6F2EA;border-radius:14px;padding:6px 8px}
.stat{padding:2px 12px;border-right:1px solid rgba(255,255,255,.1)}.stat:last-child{border:0}
.stat small{display:block;font-size:10px;color:#8FA99A;text-transform:uppercase;letter-spacing:.08em}
.stat b{font:600 17px var(--mono)}
.ibtn{width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;font-size:17px}

/* ===== 3. PANEL TUGAS (kanan) ===== */
.panel{position:fixed;top:76px;right:12px;bottom:12px;width:min(460px,42vw);background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-radius:18px;box-shadow:0 20px 50px -20px rgba(0,0,0,.35);z-index:4;display:flex;flex-direction:column;overflow:hidden;transition:translate .4s}
.panel.hide{translate:calc(100% + 24px) 0}
.ph{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.ph .tag{font:600 11px var(--mono);background:var(--dark);color:#7EE2A8;padding:3px 9px;border-radius:6px}
.ph h3{font-size:16px}
.ask{margin:12px 18px 0;background:var(--pl);border-radius:12px;padding:12px 14px;font-size:16px;font-weight:500}
.ask .big{font:700 20px var(--mono);color:var(--pd)}
.pb{padding:12px 18px 18px;overflow:auto;flex:1}
.hint{font-size:13px;color:var(--mut);margin:8px 18px 0}
.sheet{border-collapse:collapse;width:100%;font-size:13px;background:#fff}
.sheet th{background:#F1F4F2;color:#6B7A72;font-weight:600;font-size:12px;border:1px solid #DDE3DF;padding:5px 8px;text-align:left;position:sticky;top:0}
.sheet td{border:1px solid #DDE3DF;padding:6px 8px;white-space:nowrap}
.sheet.click tr:not(:first-child):hover td,.sheet td.cl:hover{background:#F1F8F4;cursor:pointer}
.sheet td.ok{background:#BFEBD2!important;font-weight:700}
.sheet td.no{background:#FDE2E2!important}
.sheet td.hl{background:#FFF4C7!important}
.sheet td.h{background:#F6F9F7;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.opt{min-height:48px;border-radius:12px;border:1px solid var(--line);background:#fff;font:600 16px var(--mono);transition:.15s}
.opt:hover{border-color:var(--p2)}.opt.no{background:#FDECEC;border-color:var(--r)}.opt.ok{background:#E9F9EF;border-color:#22C55E}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:12px;border:1px solid transparent;font:600 16px 'Poppins';transition:.12s}
.btn.pri{background:var(--p);color:#fff;box-shadow:0 4px 0 var(--pd)}.btn.pri:active{translate:0 3px;box-shadow:0 1px 0 var(--pd)}
.btn.warn{background:var(--y);color:#3D2A00;box-shadow:0 4px 0 #D99A00}
.btn.sec{background:#fff;border-color:var(--line);color:var(--ink)}
.fx{background:var(--dark);color:#E6F2EA;border-radius:12px;padding:12px 14px;font:500 14px var(--mono);margin-bottom:10px;word-break:break-word}
.fx .fn{color:#7EE2A8}
.autolist{display:flex;flex-direction:column;gap:6px}
.autolist div{display:flex;justify-content:space-between;background:#F6F9F7;border-radius:10px;padding:8px 12px;font:500 14px var(--mono);animation:pop .25s}
.autolist div b{color:var(--pd)}
@keyframes pop{from{opacity:0;translate:0 6px}}
.pvt{border-collapse:collapse;width:100%;font-size:13px}
.pvt th,.pvt td{border:1px solid #DDE3DF;padding:6px 8px;text-align:right}
.pvt th{background:var(--pl);color:var(--pd);text-align:left}.pvt td:first-child{text-align:left;font-weight:600}
.pvt td.hl{background:#FFD84D;font-weight:700}.pvt tr.gt td{background:#F1F4F2;font-weight:700}

/* ===== 4. GELEMBUNG BICARA PELANGGAN (mengikuti kepala 3D) ===== */
.bubble{position:fixed;z-index:3;translate:-50% -100%;background:#fff;border-radius:14px;padding:10px 14px;max-width:260px;font-size:15px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.18);pointer-events:none;transition:opacity .2s}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;background:#fff;rotate:45deg;translate:-50% 0}
.bubble .who{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.bubble .pat{height:6px;border-radius:9px;background:#E5E7EB;margin-top:8px;overflow:hidden}
.bubble .pat i{display:block;height:100%;background:#22C55E;transition:width .2s linear,background .3s}
.bubble.mad{background:#FEE2E2}
.qcount{position:fixed;z-index:3;translate:-50% 0;background:rgba(15,31,23,.85);color:#fff;font:600 13px var(--mono);padding:5px 10px;border-radius:9px;pointer-events:none}

/* ===== 5. MODAL (judul, masalah, solusi, ringkasan) ===== */
.modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(15,31,23,.35);backdrop-filter:blur(3px)}
.modal.on{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.mbox{background:#fff;border-radius:22px;max-width:560px;width:100%;padding:28px;box-shadow:0 30px 60px rgba(0,0,0,.3);max-height:92vh;overflow:auto}
.eyebrow{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--p)}
.mbox h2{font-size:28px;margin:6px 0 10px}
.mbox p{font-size:17px;line-height:1.6;color:#33473B}
.mbox .prob{background:#FFF6DB;border-radius:14px;padding:14px 16px;margin:14px 0;font-size:16px}
.mbox .sol{background:var(--pl);border-radius:14px;padding:14px 16px;margin:14px 0;font-size:16px}
.mbox .acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.cmp div{border-radius:14px;padding:14px;text-align:center}
.cmp .a{background:#FDECEC}.cmp .b{background:var(--pl)}
.cmp b{display:block;font:700 28px var(--mono)}.cmp .a b{color:#B91C1C}.cmp .b b{color:var(--pd)}
.cmp span{font-size:13px;color:var(--mut)}
.list6{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.list6 div{background:#F6F9F7;border-radius:12px;padding:10px 12px;font-size:14px}
.list6 b{display:block;font:600 13px var(--mono);color:var(--pd)}
.toast{position:fixed;left:50%;top:80px;translate:-50% -10px;background:var(--dark);color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;opacity:0;transition:.3s;z-index:12;pointer-events:none}
.toast.on{opacity:1;translate:-50% 0}
body.no3d #c{display:none}

/* ===== 5b. SESI 2: komputer kasir (jendela Excel) ===== */
.panel.pc{background:#1b1f1d;padding:10px;border:1px solid #333}
.panel.pc .ph{background:#107C41;color:#fff;border-radius:10px 10px 0 0;border:0}
.panel.pc .ph .tag{background:rgba(0,0,0,.25)}
.panel.pc .ask,.panel.pc .hint,.panel.pc .pb{background:#fff;margin:0}
.panel.pc .ask{border-radius:0;padding:10px 12px;border-bottom:1px solid var(--line)}
.panel.pc .hint{padding:0}
.panel.pc .pb{border-radius:0 0 10px 10px}
.xlfx{display:flex;gap:10px;align-items:stretch}
.fxl{font:italic 700 18px serif;color:var(--p);align-self:center;padding:0 4px}
.fslots{flex:1;display:flex;flex-direction:column;gap:6px}
.fslot{border:2px dashed #9DB8A8;border-radius:10px;padding:6px 10px;min-height:48px;transition:.15s;background:#FBFCFB}
.fslot small{display:block;font-size:11px;color:var(--mut);font-weight:600}
.fslot span{font:500 13px var(--mono);color:#9AA9A0}
.fslot.hot{border-color:#FFC93C;background:#FFF8E1}
.fslot.ok{border-style:solid;border-color:#22C55E;background:#E9F9EF}.fslot.ok span{color:var(--pd);font-weight:600}
.fslot.shake{animation:shake .4s}
@keyframes shake{25%{translate:-6px 0}75%{translate:6px 0}}
.xerr{display:none;margin-top:8px;background:#FDECEC;color:#7F1D1D;border-radius:10px;padding:8px 10px;font-size:13px}
.xerr.on{display:block;animation:pop .25s}
.xls td.rn{background:#F1F4F2;color:#7A887F;font-size:11px;width:28px;text-align:center}
.xls td.sel{box-shadow:inset 0 0 0 2px var(--p)}
.xnote{font-size:12px;color:var(--mut);margin:8px 0}
.sumbox{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sumbox div{background:#F6F9F7;border-radius:10px;padding:8px 10px;font-size:12px;color:var(--mut)}
.sumbox b{display:block;font:700 18px var(--mono);color:var(--pd)}
.xcards{margin-top:12px;position:sticky;bottom:-18px;background:#fff;padding:10px 0 4px;border-top:1px solid var(--line)}
.xcards h4{font:600 12px 'Inter';text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-bottom:8px}
#xCards{display:flex;flex-direction:column;gap:8px}
.fcard{text-align:left;border:1px solid #CFDCD4;background:#fff;border-radius:10px;padding:10px 12px;font:600 13px var(--mono);color:var(--ink);box-shadow:0 3px 0 #CFDCD4;touch-action:none;user-select:none;cursor:grab}
.fcard:hover{border-color:var(--p2)}
.fcard.used{opacity:.35;pointer-events:none;box-shadow:none}
.fcard.dragging{opacity:.4}
.ghost{position:fixed!important;pointer-events:none;z-index:50;rotate:-2deg;box-shadow:0 14px 28px rgba(0,0,0,.25)!important;left:0;top:0}
.chip.sesi{background:#FFC93C;color:#3D2A00}.chip.off{opacity:.35}
.pickrow{margin:14px 0}.pickrow label{display:block;font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;min-height:64px;transition:.15s}
.seg button.on{border-color:var(--p);background:var(--pl);box-shadow:0 0 0 2px rgba(16,124,65,.15)}
.seg b{display:block;font:600 15px 'Poppins'}.seg span{font-size:12px;color:var(--mut);line-height:1.35;display:block}
.seg2{display:flex;flex-wrap:wrap;gap:6px}
.seg2 button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;min-height:36px;font-weight:500}
.seg2 button.on{background:var(--p);color:#fff;border-color:var(--p)}
.vs{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 12px}
.vs th{text-align:left;font-size:12px;color:var(--mut);padding:4px 6px}
.vs td{padding:6px;border-top:1px solid var(--line);font-family:var(--mono);font-size:13px;width:38%}
.vs td:first-child{width:24%;font-family:'Inter'}
.barx{height:8px;border-radius:9px;margin-bottom:3px}.barx.a{background:#F87171}.barx.b{background:#22C55E}

/* ===== 6. RESPONSIF ===== */
@media (max-width:860px){
  #c{height:54vh}
  .chips{display:none}.brand b{display:none}.brand{padding:8px}
  .hud{top:8px;left:8px;right:8px}.stats{padding:4px 6px}.stat small{font-size:9px}.ibtn{width:34px;height:34px}
  .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:45vh}
  .panel.hide{translate:0 calc(100% + 24px)}
  .bubble{max-width:200px;font-size:13px}
  .stat{padding:2px 8px}.stat b{font-size:14px}
  .mbox{padding:20px}.mbox h2{font-size:22px}
  .seg{grid-template-columns:1fr}.seg button{min-height:52px}
  .xcards{position:static}.fslot span{font-size:12px}.fcard{font-size:12px;padding:8px 10px}
}
</style>
</head>
<body>
<canvas id="c" aria-label="Toko komputer 3D"></canvas>

<!-- HUD -->
<div class="hud">
  <div class="brand"><svg viewBox="0 0 40 40" width="28" height="28"><rect width="40" height="40" rx="10" fill="#107C41"/><path d="M8 15h24M8 22h24M8 29h16M16 9v22M24 9v13" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/><rect x="16.75" y="15.75" width="6.5" height="5.5" rx="1" fill="#FFD84D"/><circle cx="28" cy="28" r="5" fill="#107C41" stroke="#fff" stroke-width="2.5"/><path d="M31.6 31.6L35 35" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg><b>Kasir <span>Jaya Tekno</span></b></div>
  <div class="chips" id="chips"></div>
  <div class="stats">
    <div class="stat"><small>Antrean</small><b id="sQ">0</b></div>
    <div class="stat"><small>Kecewa</small><b id="sK">0</b></div>
    <div class="stat"><small id="sTL">Waktu manual</small><b id="sT">0,0</b></div>
    <button class="ibtn" id="bSfx" aria-label="Suara">🔊</button>
    <button class="ibtn" id="bMenu" aria-label="Menu pilihan sesi">☰</button>
  </div>
</div>

<!-- Panel tugas -->
<div class="panel hide" id="panel">
  <div class="ph"><span class="tag" id="pTag">VLOOKUP</span><h3 id="pTitle">Kasir</h3></div>
  <div class="ask" id="pAsk"></div>
  <div class="hint" id="pHint"></div>
  <div class="pb" id="pBody"></div>
</div>

<div class="bubble" id="bubble" style="opacity:0"><div class="who" id="bWho">Pelanggan</div><div id="bTxt"></div><div class="pat"><i id="bPat"></i></div></div>
<div class="qcount" id="qcount" style="opacity:0"></div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>
// =====================================================================
//  DATA (mudah diubah guru)
// =====================================================================
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const rp = v => typeof v === 'number' ? v.toLocaleString('id-ID') : v;
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
let seed = 11; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;

// 40 barang dengan urutan acak (kode, nama, harga)
const PRODUK = (() => {
  const nama = ['Laptop', 'Monitor', 'Keyboard', 'Mouse', 'Printer', 'Flashdisk', 'SSD', 'Harddisk', 'Router', 'Webcam', 'Headset', 'Speaker', 'Charger', 'RAM'];
  const merk = ['ASUS', 'Lenovo', 'Logitech', 'HP', 'Samsung', 'Sandisk', 'TP-Link', 'Acer'];
  const kode = new Set(), nm = new Set(), out = [];
  while (out.length < 40) {
    const k = 'ABCDEFGHJKLMNPRSTUVW'[Math.floor(rnd() * 20)] + String(10 + Math.floor(rnd() * 90));
    const n = nama[Math.floor(rnd() * nama.length)] + ' ' + merk[Math.floor(rnd() * merk.length)];
    if (kode.has(k) || nm.has(n)) continue; kode.add(k); nm.add(n);
    out.push([k, n, (Math.floor(rnd() * 150) + 5) * 50000]);
  }
  return out;
})();
const HARI = [['Hari', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'], ['Diskon', '5%', '0%', '10%', '0%', '15%', '20%', '25%'], ['Promo', 'Hemat Senin', '-', 'Rabu Ceria', '-', 'Jumat Berkah', 'Weekend', 'Weekend']];
const CABANG = ['Tangerang', 'Jakarta', 'Bekasi'], KATEG = ['Komputer', 'Aksesoris', 'Penyimpanan', 'Jaringan'];
const STRUK = Array.from({ length: 24 }, (_, i) => [i + 1, CABANG[Math.floor(rnd() * 3)], KATEG[Math.floor(rnd() * 4)], (Math.floor(rnd() * 40) + 2) * 50000]);
const BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const PENJUALAN = [92, 88, 97, 105, 101, 110, 108, 84, 96, 103, 115, 128];
const BULAN_PANJANG = { Jan: 'Januari', Feb: 'Februari', Mar: 'Maret', Apr: 'April', Mei: 'Mei', Jun: 'Juni', Jul: 'Juli', Agu: 'Agustus', Sep: 'September', Okt: 'Oktober', Nov: 'November', Des: 'Desember' };

// =====================================================================
//  SUARA (Web Audio)
// =====================================================================
let AC = null, sfxOn = true;
function tone(f, t0, d, type = 'sine', v = .1) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); const t = AC.currentTime + t0, o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .05); } catch (e) { } }
function sfx(n) {
  if (!sfxOn) return;
  ({ click: () => tone(660, 0, .05, 'triangle', .05), cash: () => { tone(1318, 0, .08, 'square', .04); tone(1760, .08, .18, 'sine', .08); },
    bad: () => { tone(220, 0, .16, 'sawtooth', .04); tone(165, .1, .22, 'sawtooth', .04); }, mad: () => { tone(300, 0, .12, 'square', .04); tone(200, .12, .25, 'square', .04); },
    ok: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, i * .08, .22, 'triangle', .09)), door: () => { tone(988, 0, .15, 'sine', .05); tone(784, .15, .25, 'sine', .05); },
    zap: () => { for (let i = 0; i < 6; i++) tone(600 + i * 180, i * .03, .08, 'triangle', .05); } }[n] || (() => { }))();
}
$('#bSfx').onclick = () => { sfxOn = !sfxOn; $('#bSfx').textContent = sfxOn ? '🔊' : '🔈'; };
let toastT; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2000); }

// =====================================================================
//  SCENE 3D (Three.js): toko, rak, meja kasir, pelanggan low-poly
// =====================================================================
const HAS3D = !!window.THREE;
let renderer, scene, camera, scrCanvas, scrTex;
// Layar monitor 3D: grid Excel + rumus yang sedang dipakai
function setScreen(f) {
  if (!scrCanvas) return; const g = scrCanvas.getContext('2d'), w = 512, h = 300;
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.fillStyle = '#107C41'; g.fillRect(0, 0, w, 34); g.fillStyle = '#fff'; g.font = '600 18px Inter, sans-serif'; g.fillText('Kasir_JayaTekno.xlsx', 14, 23);
  g.fillStyle = '#F1F4F2'; g.fillRect(0, 34, w, 34); g.fillStyle = '#107C41'; g.font = 'italic 700 18px serif'; g.fillText('fx', 12, 57);
  g.fillStyle = '#14211A'; g.font = '600 15px monospace'; g.fillText((f || '').slice(0, 52), 44, 57);
  g.strokeStyle = '#D5DDD8'; for (let i = 0; i < 12; i++) { g.beginPath(); g.moveTo(0, 68 + i * 20); g.lineTo(w, 68 + i * 20); g.stroke(); } for (let j = 0; j < 8; j++) { g.beginPath(); g.moveTo(j * 72, 68); g.lineTo(j * 72, h); g.stroke(); }
  if (f) { g.fillStyle = '#BFEBD2'; for (let i = 0; i < 5; i++) g.fillRect(145, 89 + i * 20, 70, 19); } else { g.fillStyle = '#FFD84D'; g.fillRect(145, 89, 70, 19); }

  } else {
    G.salah++; sfx('bad'); slotEl.classList.remove('shake'); void slotEl.offsetWidth; slotEl.classList.add('shake');
    const other = F.slots.findIndex(s => s.ok === id);
    err.className = 'xerr on'; err.innerHTML = `<b>${card.why ? (card.why.includes('#N/A') ? '#N/A' : 'Kurang tepat') : 'Salah kotak'}</b> · ${card.why || `Rumus ini benar, tapi untuk kotak "${F.slots[other].label}".`}`;
  }
}
async function finishFormula() {
  const s = STAGES[G.stage]; G.phase = 'filling';
  G.res[G.stage].rumus = G.stageTime; G.res[G.stage].salah = G.salah;
  if (!s.manager) {
    const list = [...G.queue];
    for (let k = 0; k < list.length; k++) { const c = $('#out' + k); if (c) { c.textContent = list[k].req.b; c.classList.add('ok'); } sfx('cash'); leave(list[k], 'ok'); await new Promise(r => setTimeout(r, 180)); }
  } else { await new Promise(r => setTimeout(r, 900)); sfx('cash'); if (G.queue[0]) leave(G.queue[0], 'ok'); }
  await new Promise(r => setTimeout(r, 900));
  const R = G.res[G.stage], [n1, n2] = nTugas(G.stage), p1 = R.manual / n1, p2 = R.rumus / n2, kali = p2 > 0 ? Math.max(1, Math.round(p1 / p2)) : '∞';
  const lastBtn = G.idx < G.pilih.length - 1 ? 'Masalah berikutnya →' : 'Lihat hasil akhir →';
  if (!R.manual) return modal(`<span class="eyebrow">Sesi 2 · Masalah ${G.stage + 1} beres · ${s.tag}</span><h2>Beres pakai rumus!</h2>
    <div class="cmp" style="grid-template-columns:1fr"><div class="b"><b>${fmtS(R.rumus)} dtk</b><span>untuk ${n2} ${s.manager ? 'tugas' : 'pelanggan sekaligus'}${R.salah ? ` · ${R.salah} kartu salah` : ''}</span></div></div>
    <p style="font-size:15px">${s.solusi}</p><div class="fx">${s.rumus.replace(/([A-Z]+)\(/g, '<span class="fn">$1(</span>')}</div>
    <p class="mut" style="font-size:14px">Mau merasakan bedanya? Coba juga Sesi 1 (manual) dari menu ☰.</p>
    <div class="acts"><button class="btn pri" data-go="next">${lastBtn}</button></div>`);
  modal(`<span class="eyebrow">Sesi 2 · Masalah ${G.stage + 1} beres · ${s.tag}</span><h2>Manual vs rumus</h2>
    <div class="cmp"><div class="a"><b>${fmtS(p1)} dtk</b><span>per ${s.manager ? 'tugas' : 'pelanggan'} · Sesi 1 manual<br>(${fmtS(R.manual)} dtk untuk ${n1}${R.kecewa ? `, ${R.kecewa} kecewa` : ''})</span></div><div class="b"><b>${fmtS(p2)} dtk</b><span>per ${s.manager ? 'tugas' : 'pelanggan'} · Sesi 2 rumus<br>(${fmtS(R.rumus)} dtk untuk ${n2}${s.manager ? '' : ' sekaligus'})</span></div></div>
    <p style="font-size:15px">${p1 > p2 ? `Kira-kira <b>${kali}× lebih cepat</b> per ${s.manager ? 'tugas' : 'pelanggan'}. ` : ''}${s.solusi}</p>
    <div class="fx">${s.rumus.replace(/([A-Z]+)\(/g, '<span class="fn">$1(</span>')}</div>
    <div class="acts"><button class="btn pri" data-go="next">${lastBtn}</button></div>`);
}
function tick(dt) {
  if (G.phase === 'formula') { G.stageTime += dt; G.total[2] += dt; $('#sT').textContent = fmtS(G.total[2]); return; }
  if (G.phase !== 'manual') return;
  const s = STAGES[G.stage]; G.stageTime += dt; G.total[1] += dt; $('#sT').textContent = fmtS(G.total[1]);
  if (s.spawn) { G.spawnT += dt; if (G.spawnT > 4.5 && G.queue.length < 8) { G.spawnT = 0; spawn(); } }
  assignTask();
  const f = G.queue[0];
  if (f && f.task) {
    f.wait += dt; const left = Math.max(0, 1 - f.wait / s.patience), bar = $('#bPat');
    bar.style.width = (left * 100) + '%'; bar.style.background = left > .5 ? '#22C55E' : left > .25 ? '#FACC15' : '#EF4444';
    if (left < .25) $('#bubble').classList.add('mad');
    if (left <= 0) {
      sfx('mad'); G.kecewa++; G.kecewaStage++; $('#sK').textContent = G.kecewa; G.handled++;
      toast(s.manager ? '😤 Manajer kesal menunggu terlalu lama!' : '😤 Pelanggan pergi karena kelamaan!');
      if (s.manager) G.handled = s.manualN;
      leave(f, 'mad'); afterHandle();
    }
  }
}
function finale() {
  G.phase = 'end'; G.stage = STAGES.length; drawChips(); $('#panel').classList.add('hide'); clearQueue();
  const m = G.total[1], r = G.total[2], adaManual = G.pilih.some(i => G.res[i].manual > 0);
  const per = G.pilih.map(i => { const [a, b] = nTugas(i); return [i, G.res[i].manual / a, G.res[i].rumus / b]; }), mx = Math.max(...per.flatMap(x => [x[1], x[2]]), .1);
  const t1 = G.pilih.reduce((s, i) => s + nTugas(i)[0], 0), t2 = G.pilih.reduce((s, i) => s + nTugas(i)[1], 0);
  modal(`<span class="eyebrow">Perbandingan akhir</span><h2>Kerja pakai mata vs kerja pakai rumus</h2>
    <div class="cmp" style="${adaManual ? '' : 'grid-template-columns:1fr'}">${adaManual ? `<div class="a"><b>${fmtS(m)} dtk</b><span>Sesi 1 · manual · ${t1} tugas · ${G.kecewa} kecewa</span></div>` : ''}<div class="b"><b>${fmtS(r)} dtk</b><span>Sesi 2 · rumus · ${t2} tugas · 0 kecewa</span></div></div>
    <table class="vs"><tr><th>Masalah</th><th>Sesi 1 (per tugas)</th><th>Sesi 2 (per tugas)</th></tr>${per.map(([i, a, b]) => `<tr><td><b>${STAGES[i].tag}</b></td><td>${a ? `<div class="barx a" style="width:${Math.max(6, a / mx * 100)}%"></div>${fmtS(a)} dtk` : '<span style="color:#9AA9A0">belum dicoba</span>'}</td><td><div class="barx b" style="width:${Math.max(6, b / mx * 100)}%"></div>${fmtS(b)} dtk</td></tr>`).join('')}</table>
    <p>Di Sesi 2 kamu cuma butuh <b>memilih rumus yang tepat</b>, dan komputer yang mengerjakan sisanya, untuk 5 pelanggan sekaligus. Toko sungguhan punya <b>ribuan transaksi</b> per hari. Itulah yang akan kita pelajari hari ini.</p>
    <div class="acts"><button class="btn pri" data-go="menu">Kembali ke menu</button></div>`);
  sfx('ok');
}

// =====================================================================
// =====================================================================
//  BOOT
// =====================================================================
initScene(); drawChips(); title(); requestAnimationFrame(loop);
let lastT = performance.now();
setInterval(() => { const n = performance.now(); tick((n - lastT) / 1000); lastT = n; }, 100);
</script>
</body>
